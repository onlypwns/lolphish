# Approved entry-proposal issue → validated branch + PR.
# Flow: contributor opens [ENTRY] issue → maintainer reviews →
# maintainer adds the "approved" label → this workflow extracts the
# YAML, validates it, and opens a PR. Merging the PR triggers
# build-and-deploy.yml, which regenerates the site.

name: Approved entry → PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  entry-to-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'entry-proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema

      - name: Extract entry YAML from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          body = os.environ["ISSUE_BODY"]
          m = re.search(r"```yaml\s*\n(.*?)```", body, re.S)
          if not m:
              sys.exit("No ```yaml block found in issue body")
          with open("candidate.yml", "w") as f:
              f.write(m.group(1))
          print("extracted")
          EOF

      - name: Validate candidate entry
        run: |
          mkdir -p /tmp/lolphish-check
          cp candidate.yml /tmp/lolphish-check/
          python3 - <<'EOF'
          import yaml, json, sys, jsonschema
          entry = yaml.safe_load(open("candidate.yml"))
          schema = json.load(open("schema/entry.schema.json"))
          try:
              jsonschema.validate(entry, schema)
          except jsonschema.ValidationError as e:
              print(f"::error::Schema violation — {e.message}")
              sys.exit(1)
          slug = entry["id"]
          import os
          if os.path.exists(f"entries/{slug}.yml"):
              print(f"::error::Entry '{slug}' already exists")
              sys.exit(1)
          with open("slug.txt", "w") as f:
              f.write(slug)
          print(f"Valid entry: {slug}")
          EOF

      - name: Create branch with new entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG=$(cat slug.txt)
          git config user.name "lolphish-bot"
          git config user.email "bot@lolphish.local"
          git checkout -b "entry/$SLUG"
          cp candidate.yml "entries/$SLUG.yml"
          git add "entries/$SLUG.yml"
          git commit -m "Add entry: $SLUG (from issue #${{ github.event.issue.number }})"
          git push origin "entry/$SLUG"

      - name: Open PR and link the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG=$(cat slug.txt)
          gh pr create \
            --title "Add entry: $SLUG" \
            --body "Auto-generated from approved issue #${{ github.event.issue.number }} (proposed by @${{ github.event.issue.user.login }}). Schema-validated on creation. Closes #${{ github.event.issue.number }}." \
            --head "entry/$SLUG" --base main
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ Approved — PR opened with your entry. It goes live when the PR merges and the site rebuilds (about a minute). Thanks for contributing!"
