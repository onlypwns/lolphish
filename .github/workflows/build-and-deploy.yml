# Rebuild data.js + api/entries.json whenever entries change on main,
# then commit the regenerated files. GitHub Pages (branch source)
# picks up the commit and redeploys automatically.

name: Validate, build & deploy

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "schema/**"
      - "build.py"
  pull_request:
    paths:
      - "entries/**"
      - "schema/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema

      - name: Validate entries (PR gate)
        if: github.event_name == 'pull_request'
        run: python3 build.py --check

      - name: Build site data
        if: github.event_name == 'push'
        run: python3 build.py

      - name: Commit regenerated files
        if: github.event_name == 'push'
        run: |
          git config user.name "lolphish-bot"
          git config user.email "bot@lolphish.local"
          git add data.js api/entries.json
          if git diff --staged --quiet; then
            echo "No changes — data.js already up to date"
          else
            git commit -m "Rebuild catalog data [skip ci]"
            git push
          fi
