# LOLPHISH entry — SMTP Auth MFA Bypass
id: smtp-mfa-bypass
name: SMTP Auth MFA Bypass / Legacy Protocol Delivery
category: Trusted Delivery
status: partially-mitigated
vendors:
- Microsoft 365 / Exchange Online
summary: SMTP AUTH is a mail-sending protocol in Exchange Online that can use OAuth or, where it remains
  available, Basic authentication. Per-mailbox settings and organization policy determine whether a user can use it.
abuse: Where password-based SMTP AUTH remains enabled and applicable controls permit legacy authentication,
  a stolen username and password can let an attacker send mail as the compromised user without an interactive
  MFA challenge. The messages inherit the real mailbox identity and can support internal phishing or reply-chain
  abuse. This is a configuration-dependent post-compromise path, not an intrinsic bypass of every Conditional
  Access policy; policies that block legacy authentication can stop it.
prerequisites:
- Valid credentials for the target mailbox
- Basic SMTP AUTH enabled and available for that mailbox
- No applicable policy successfully blocking legacy authentication for the sign-in
evidence:
- type: vendor-documentation
  description: Microsoft documents SMTP AUTH configuration, per-mailbox overrides, OAuth support, and controls for disabling Basic authentication.
variants:
- Compromised credential → direct SMTP Auth lure delivery
- SMTP Auth used for reply-chain hijacking from a real mailbox
- Per-user SMTP Auth enabled despite tenant-level disablement
- SMTP Auth combined with mailbox rules to auto-forward replies or amplify internal phishing
kits:
- MFASweep / TREVORspray (credential validation)
- Send-MailMessage (PowerShell)
- Python smtplib scripts
- Commodity BEC tooling
surfaces:
- smtp.office365.com
- outlook.office365.com
- Authenticated user mailbox
attack:
- T1566.001 — Spearphishing Attachment
- T1566.002 — Spearphishing Link
- T1556 — Modify Authentication Process
- T1078 — Valid Accounts
detections:
- Exchange Online Message Trace / SigninLogs showing `SMTP` authentication protocol
- Outbound mail volume spike from a single mailbox
- Internal phishing reports referencing messages sent by known users but with unusual links
- Inbound mail flow where sender's SPF passes but Authentication-Results shows `smtp.auth` origin
mitigations:
- Disable SMTP Auth tenant-wide and block per-user exceptions except for documented legacy devices
- Enforce modern authentication and disable basic auth for all Exchange Online protocols
- Alert on any `SMTP` protocol sign-in in SigninLogs
- Implement mailbox anomaly detection for unusual outbound volume or internal-only phishing
detection_code:
- lang: kql
  query: |
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where ResultType == 0
    | where ClientAppUsed == "SMTP"
    | project TimeGenerated, UserPrincipalName, IPAddress, Location, ClientAppUsed,
              AppDisplayName, ConditionalAccessStatus
    | sort by TimeGenerated desc
  description: Successful SMTP authentication events — legacy protocol bypassing Conditional Access.
  source: Threat Hunting Wiki — T016 smtp-mfa-bypass
- lang: kql
  query: |
    let KnownPairs = SigninLogs
    | where TimeGenerated between (ago(30d) .. ago(1d))
    | where ResultType == 0 and ClientAppUsed == "SMTP"
    | distinct UserPrincipalName, IPAddress;
    SigninLogs
    | where TimeGenerated > ago(1d)
    | where ResultType == 0 and ClientAppUsed == "SMTP"
    | join kind=leftanti KnownPairs on UserPrincipalName, IPAddress
    | project TimeGenerated, UserPrincipalName, IPAddress, Location,
              AppDisplayName, ConditionalAccessStatus
    | sort by TimeGenerated desc
  description: Successful SMTP authentication from a user/IP pair absent from the preceding 29-day baseline.
  source: LOLPHISH
refs:
