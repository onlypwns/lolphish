# LOLPHISH entry — Device Code Flow Phishing
id: entra-device-code
name: Device Code Flow Phishing
category: Identity Flow Abuse
status: partially-mitigated
vendors:
- Microsoft Entra ID
summary: RFC 8628 device authorization grant — built so input-constrained devices (TVs, consoles, IoT)
  can sign in by having the user enter a short code on a second device at a real vendor URL.
abuse: Attacker initiates a device code flow unauthenticated, then lures the victim to the genuine login
  page (microsoft.com/devicelogin) to enter the attacker's code. The victim completes their own MFA on
  Microsoft's real infrastructure — there is no phish page, no fake domain, nothing to block at the perimeter.
  The attacker polls the token endpoint and walks away with access + refresh tokens. Refresh tokens self-renew
  for ~90 days, and targeting the Microsoft Authentication Broker client ID escalates to PRT-grade persistence
  that survives password resets.
variants:
- Microsoft Authentication Broker client ID targeting (PRT / device registration path)
- Teams/phone-call lure ('enter this code to join the meeting')
- QR-delivered codes (device code + quishing hybrid)
- Azure CLI / Azure PowerShell client IDs for scope selection
kits:
- EvilTokens
- Kali365 / Octopi365
- SquarePhish2
- TokenTactics (POC)
- Storm-2372 (actor)
surfaces:
- microsoft.com/devicelogin
- login.microsoftonline.com
attack:
- T1566 — Phishing
- T1528 — Steal Application Access Token
- T1550.001 — Use Alternate Authentication Material
detections:
- 'Entra sign-in logs: authenticationProtocol = deviceCodeFlow (hunt for source ASNs in hosting ranges
  — e.g. Tencent AS132203 in the Kali365 campaign)'
- 'M365 Defender: ''Device code flow phishing'' related alerts; impossible-travel + device-code combo'
- Correlate lure-hosting referrers (Canva, shorteners) with devicelogin completions
detection_code:
- lang: kql
  query: |
    let CriticalBypassApps = dynamic([
        "4813382a-8fa7-425e-ab75-3b753aab3abb",  // Microsoft Authenticator App
        "9ba1a5c7-f17a-4de9-a1f1-6178c8d51223"   // Microsoft Intune Company Portal
    ]);
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where AuthenticationProtocol == "deviceCodeFlow"
    | where ResultType == 0
    | extend
        City          = tostring(parse_json(LocationDetails).city),
        Country       = tostring(parse_json(LocationDetails).countryOrRegion),
        IsCriticalApp = AppId in (CriticalBypassApps)
    | project
        TimeGenerated, UserPrincipalName, AppDisplayName, AppId, IPAddress,
        City, Country, RiskLevelDuringSignIn, ConditionalAccessStatus, IsCriticalApp
    | extend Severity = case(
        IsCriticalApp == true,                       "CRITICAL — CA Bypass 3 app",
        RiskLevelDuringSignIn in ("high","medium"),  "HIGH    — risky sign-in",
        ConditionalAccessStatus == "notApplied",     "MEDIUM  — CAP not enforced",
        "LOW     — review"
      )
    | sort by TimeGenerated desc
  description: Successful device-code grants; escalates when targeting Authenticator/Intune Company Portal (CA Bypass 3).
  source: Threat Hunting Wiki — D001 device-code-indicators
- lang: kql
  query: |
    AADNonInteractiveUserSignInLogs
    | where TimeGenerated > ago(1h)
    | where ResultType == 50199  // Device code pending — attacker polling
    | summarize
        PollCount      = count(),
        UniqueUsers    = dcount(UserPrincipalName),
        UniqueApps     = dcount(AppId),
        TargetUsers    = make_set(UserPrincipalName),
        Apps           = make_set(AppDisplayName)
        by IPAddress, bin(TimeGenerated, 15m)
    | where PollCount > 3 or UniqueUsers > 1
    | extend ThreatSignal = case(
        UniqueUsers > 5,  "HIGH — mass campaign",
        UniqueUsers > 1,  "MEDIUM — multi-target",
        PollCount > 10,   "MEDIUM — repeated single-target",
        "LOW — review"
      )
    | sort by UniqueUsers desc, PollCount desc
  description: Dynamic device-code phishing campaigns — mass polling from one IP before any victim authenticates.
  source: Threat Hunting Wiki — D001 device-code-indicators
- lang: kql
  query: |
    let DeviceCodeGrants = SigninLogs
    | where TimeGenerated > ago(2h)
    | where AuthenticationProtocol == "deviceCodeFlow"
    | where ResultType == 0
    | project GrantTime = TimeGenerated, UPN = UserPrincipalName, GrantIP = IPAddress, GrantApp = AppDisplayName;
    let TokenRefreshes = AADNonInteractiveUserSignInLogs
    | where TimeGenerated > ago(2h)
    | where ResultType == 0
    | where AuthenticationProtocol != "deviceCodeFlow"
    | project RefreshTime = TimeGenerated, UPN = UserPrincipalName, RefreshIP = IPAddress, RefreshApp = AppDisplayName;
    DeviceCodeGrants
    | join kind=inner TokenRefreshes on UPN
    | where RefreshTime > GrantTime and RefreshTime < datetime_add('minute', 30, GrantTime)
    | where GrantIP == RefreshIP
    | project UPN, GrantTime, GrantApp, GrantIP, RefreshTime, RefreshApp,
              MinutesBetween = datetime_diff('minute', RefreshTime, GrantTime)
    | sort by MinutesBetween asc
  description: Post-grant FOCI pivot — same-IP cross-app token refresh within 30 minutes of a device-code grant.
  source: Threat Hunting Wiki — D001 device-code-indicators
mitigations:
- Conditional Access authentication-flows policy to block device code flow (Microsoft auto-provisions
  this for tenants now — verify, don't assume)
- Token protection / CA session controls to bind tokens to device
- 'User training: you never ''enter a code'' to join a meeting'
