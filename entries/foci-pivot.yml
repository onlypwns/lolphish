# LOLPHISH entry — FOCI Token Family Pivoting
id: foci-pivot
name: FOCI Token Family Pivoting
category: Identity Flow Abuse
status: active
vendors:
- Microsoft Entra ID
summary: 'Family of Client IDs (FOCI) lets Microsoft''s own apps share refresh tokens: a refresh token
  issued to one family member can be redeemed for tokens to another family member''s resources.'
abuse: 'A stolen family refresh token may be redeemable by another client in the same family, subject to
  the token family, tenant policy, resource authorization, consent, and scope behavior. This can let an attacker
  request tokens through first-party clients beyond the client that obtained the original token and complicate
  incident scoping. It is not unrestricted access to every family client or resource; defenders should revoke
  the user session family and validate which resources were actually reached.'
prerequisites:
- A stolen refresh token issued to a client participating in the relevant token family
- Another family client and requested resource/scope combination accepted by the identity platform
- User and tenant authorization for the target resource
variants:
- Broker-client escalation into FOCI family
- Post-AiTM session laundering into FOCI tokens for durability
- Refresh-token resale pipelines (token markets) keyed on FOCI membership
kits:
- TokenTactics (POC)
- ROADtools (research)
- entrascopes.com (FOCI filter)
surfaces:
- First-party refresh token family
attack:
- T1550.001 — Use Alternate Authentication Material
- T1528 — Steal Application Access Token
detections:
- Token redemptions for client IDs with no corresponding interactive sign-in
- Single user, many first-party client IDs in short windows
- Correlate refresh events against phishing-sign-in events (device code, AiTM ASN)
detection_code:
- lang: kql
  query: |
    AADNonInteractiveUserSignInLogs
    | where TimeGenerated > ago(1h)
    | where ResultType == 0
    | summarize
        DistinctApps  = dcount(AppId),
        AppList       = make_set(AppDisplayName),
        TokenCount    = count(),
        UniqueIPs     = dcount(IPAddress),
        IPList        = make_set(IPAddress),
        FirstSeen     = min(TimeGenerated),
        LastSeen      = max(TimeGenerated)
        by UserPrincipalName, IPAddress, bin(TimeGenerated, 5m)
    | where DistinctApps > 2 and TokenCount > 3
    | extend RiskSignal = case(
        DistinctApps >= 5, "CRITICAL — full FOCI family sweep",
        DistinctApps >= 3, "HIGH — multi-app token exchange",
        "MEDIUM — review"
      )
    | sort by DistinctApps desc, TokenCount desc
  description: Rapid non-interactive activity across multiple first-party app IDs from the same IP; investigate as a correlation signal because the query does not prove family-token redemption.
  source: Threat Hunting Wiki — D002 foci-token-anomalies
- lang: kql
  query: |
    let LookbackWindow = 2h;
    let PivotWindow    = 30m;
    let GraphTokens =
        AADNonInteractiveUserSignInLogs
        | where TimeGenerated > ago(LookbackWindow)
        | where ResultType == 0
        | where ResourceDisplayName == "Microsoft Graph"
        | project GraphTime = TimeGenerated, UPN = UserPrincipalName, GraphIP = IPAddress;
    GraphTokens
    | join kind=inner (
        AADNonInteractiveUserSignInLogs
        | where TimeGenerated > ago(LookbackWindow)
        | where ResultType == 0
        | where ResourceDisplayName == "Windows Azure Service Management API"
        | project ArmTime = TimeGenerated, UPN = UserPrincipalName, ArmIP = IPAddress
    ) on UPN
    | where ArmTime > GraphTime
          and ArmTime < datetime_add('minute', PivotWindow, GraphTime)
    | project
        GraphTime,
        ArmTime,
        MinutesBetween = datetime_diff('minute', ArmTime, GraphTime),
        UPN,
        GraphIP,
        ArmIP,
        SameIP = GraphIP == ArmIP
    | sort by MinutesBetween asc
  description: Correlates Graph and Azure Resource Manager activity within 30 minutes; this sequence alone does not prove FOCI-mediated token exchange.
  source: Threat Hunting Wiki — D002 foci-token-anomalies
mitigations:
- Revoke at the user level (all refresh tokens) on any identity-phish event — not per-session
- Continuous Access Evaluation where supported
- Token protection CA policies for Exchange/SharePoint (P2)
refs:
- title: entrascopes — FOCI status per first-party app
  url: https://entrascopes.com/
- title: AADInternals — FOCI research
  url: https://aadinternals.com/
related:
- entra-device-code
- entra-ropc-firstparty
since: 2020 (public research)
