# LOLPHISH entry — Cross-Tenant B2B Collaboration Abuse
id: cross-tenant-b2b-abuse
name: Cross-Tenant B2B Collaboration Abuse
category: Identity Flow Abuse
status: active
vendors:
- Microsoft Entra ID
summary: Microsoft Entra External Identities let users from one tenant access resources in another as B2B guests. Cross-tenant settings separately control access, automatic redemption, and whether the resource tenant accepts MFA or device claims from a trusted home tenant.
abuse: An attacker controlling an identity in an allowed source tenant may reach resources granted to that
  guest or synchronized identity. If inbound trust accepts an MFA claim already satisfied in the home tenant,
  the resource tenant need not prompt again; its applicable Conditional Access policies still govern access.
  Risk increases when guest users receive Member-like directory visibility, synchronization is too broad, or
  an overprivileged application can create or modify external identities. A course lab demonstrated a directory
  switch without an additional MFA prompt after TAP authentication under its configured cross-tenant trust.
prerequisites:
- Control of an identity or application in an allowed source tenant
- A guest, synchronized identity, invitation path, or other authorization in the resource tenant
- Cross-tenant access, trust, and resource permissions that permit the requested operation
evidence:
- type: lab-scenario
  description: A course lab reported switching into a mapped resource tenant without another MFA prompt after authentication in the home tenant under configured cross-tenant trust.
- type: vendor-documentation
  description: Microsoft documents separate inbound access controls, automatic redemption, and trust of MFA and device claims from external tenants.
variants:
- Directory switch without a repeated MFA prompt when inbound trust accepts the home tenant MFA claim
- Self-service guest sign-up escalated to Member access level
- Cross-tenant synchronization of compromised users
- Server-side B2B invite via overprivileged web-app SP using mutable claims (department/jobTitle)
- ROPC against target authority with home-tenant credentials post-invite
kits:
- Microsoft Graph PowerShell / Invoke-RestMethod
- ROADtools / roadtx
- Custom invite automation
surfaces:
- login.microsoftonline.com
- graph.microsoft.com/v1.0/invitations
- Entra ID "Switch Directory" UI
- Cross-tenant access settings
attack:
- T1199
- T1078.004
detections:
- SigninLogs with CrossTenantAccessType == B2BCollaboration and ConditionalAccessStatus == notApplied
- AuditLogs OperationName "Invite external user" initiated by a service principal rather than a user
- Guest UserType changed to Member
- ROPC sign-ins from external IPs shortly after B2B invite redemption
- Same IP/session triggering a web-app sign-in followed by a B2B invite
detection_code:
- lang: kql
  query: |
    SigninLogs
    | where CrossTenantAccessType == "B2BCollaboration"
    | where ConditionalAccessStatus == "notApplied"
    | summarize Count=count(), IPs=make_set(IPAddress), Apps=make_set(AppDisplayName) by UserPrincipalName, HomeTenantId, ResourceTenantId
    | where Count > 2
  description: Surfaces cross-tenant B2B sign-ins where Conditional Access was not applied; investigate access scope and trust settings rather than treating this alone as proof of bypass.
  source: LOLPHISH / threat-hunting-wiki T024
mitigations:
- Restrict inbound B2B to explicitly trusted tenants only
- Never suppress MFA for external tenants unless absolutely required
- Keep guest access level at Guest (not Member) by default
- Disable self-service guest sign-up
- Enforce a Conditional Access policy targeting Guest or external users that requires MFA
refs:
- title: Microsoft — Cross-tenant access settings
  url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-overview
related:
- tap-abuse
- pim-abuse
since: "2024"
