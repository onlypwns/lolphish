# LOLPHISH entry — ROPC + First-Party Client ID Abuse
id: entra-ropc-firstparty
name: ROPC + First-Party Client ID Abuse
category: Identity Flow Abuse
status: active
vendors:
- Microsoft Entra ID
summary: Resource Owner Password Credentials is a legacy OAuth grant where username+password are sent
  straight to the token endpoint. Microsoft pre-consents dozens of first-party client IDs (Office, Teams,
  Azure CLI, broker apps) with broad scopes in every tenant.
abuse: With a phished or otherwise compromised password, an attacker can attempt ROPC as a public first-party
  client and request pre-consented scopes without an interactive browser. The flow succeeds only where the
  account and requested resource do not require controls that ROPC cannot satisfy. Course lab work demonstrated
  a Microsoft Graph token being issued with a first-party client ID and a mobile-looking User-Agent under the
  lab's policy configuration. Changing User-Agent text does not itself prove device compliance or universally
  bypass MFA or Conditional Access.
prerequisites:
- Valid username and password for the target user
- A tenant, account, client, and requested resource configuration that permits ROPC
- Applicable Conditional Access and authentication requirements that do not block the flow
evidence:
- type: lab-scenario
  description: A course lab reported successful Microsoft Graph token acquisition through ROPC using a first-party client ID and mobile-looking User-Agent.
- type: vendor-documentation
  description: Microsoft documents ROPC as a legacy flow that cannot satisfy interactive MFA and can be blocked when MFA is required.
- type: public-research
  description: Public Entra tooling and client catalogs document first-party client IDs, scopes, and token-family behavior used when assessing conditional paths.
variants:
- Client-ID shopping for CA-bypass (per-app CA evaluation gaps)
- 'Scope staircasing: minimal scope for login, pivot to Mail.Read via FOCI'
- ROPC against legacy-basic-auth-adjacent tenants that never blocked it
- 'Combined with AiTM: replay phished creds via ROPC to mint durable refresh tokens'
kits:
- AADInternals (research)
- ROADtools (research)
- entrascopes.com (reference catalog)
surfaces:
- login.microsoftonline.com token endpoint
- Pre-consented first-party app registrations
attack:
- T1078 — Valid Accounts
- T1528 — Steal Application Access Token
- T1110 — Brute Force
detections:
- Sign-ins with client app = 'Other clients' / public clients from data-center ASNs
- Non-interactive sign-in volume spikes per client ID
- Alert on known-abused first-party client IDs appearing from new IP ranges per user
detection_code:
- lang: kql
  query: |
    AADNonInteractiveUserSignInLogs
    | where AuthenticationProtocol == "ropc"
    | summarize Count=count(), IPs=make_set(IPAddress), Apps=make_set(AppDisplayName), AppIds=make_set(AppId) by UserPrincipalName
    | where Count > 5
    | extend IPCount=array_length(IPs)
    | where IPCount > 2
  description: Surfaces users with multiple ROPC non-interactive sign-ins across multiple IPs/apps, a pattern common in first-party client-ID abuse.
  source: LOLPHISH
mitigations:
- Block ROPC and legacy authentication paths with Conditional Access; verify coverage with sign-in tests rather than assuming policy scope
- 'CA: require compliant/hybrid-joined device for public-client flows'
- 'Hunt baseline: enumerate which first-party client IDs your users legitimately use; alert off-baseline'
refs:
- title: entrascopes — Entra first-party apps & scope browser
  url: https://entrascopes.com/
- title: AADInternals
  url: https://aadinternals.com/
related:
- foci-pivot
since: 2019 (research) / ongoing in the wild
